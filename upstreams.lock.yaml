# 上游锁文件 · 随 release 分发
#
# 101 个上游 skill 的清单 + 内容 sha256 + 每仓 pin 的 commit。
# 它是「处置表」与「上游实物」之间那本可随包分发的账：
#   - 没有 upstreams/ 时，用它核对 registry 的处置表与 sources（干净 clone 也成立）
#   - 有 upstreams/ 时，check-closure 会逐条比 sha256 并核 pin，把漂移抓出来
# 由 scripts/sync-upstreams.sh 重新生成，不要手工编辑。
#
# 生成方式：见 scripts/sync-upstreams.sh

schema: tpw-upstreams-lock/1
why: 处置表的可核对性不能依赖 upstreams/ 目录——那三个只读克隆被 .gitignore 挡着，从不随 release 分发。干净 clone 出来 C7/C9 必然红，而 coldstart
  又要求把检查器复制到下游且不依赖本库运行时路径。**这份锁文件就是那本可随包分发的账。**
verify: 有 upstreams/ 时逐条比 sha256 并核 pin；没有时只用它核对处置表与 sources。
